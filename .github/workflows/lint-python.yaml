name: Lint Python

on: [pull_request]
jobs:
  ruff-lint:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-files: |
            pyproject.toml
            uv.lock
          uv-version: "0.8.3"

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --group lint

      - name: Run ruff
        run: uv run ruff check src tests

  typing-lint:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-files: |
            pyproject.toml
            uv.lock
          uv-version: "0.8.3"

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --group lint

      - name: Run pyright
        run: uv run pyright src tests
